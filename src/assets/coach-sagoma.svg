<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Allenatore senza foto">
  <!-- Ripiego locale per l'allenatore senza fotografia.
       Taglio da ritratto, non icona utente: la figura esce dal bordo
       inferiore e il taglio e' stretto sulle spalle, come le foto vere.
       Palette del flusso: fondo blu-nero, figura avorio smorzato. -->
  <defs>
    <linearGradient id="co-sf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c26"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#co-sf)"/>
  <g fill="#7f7a6d" opacity=".5">
    <!-- spalle larghe, tagliate dai bordi: riempiono il riquadro -->
    <path d="M60 60c-24 0-43 16-47 38-1 8-2 15-2 22h98c0-7-1-14-2-22-4-22-23-38-47-38z"/>
    <!-- testa, alta nel riquadro come in un ritratto -->
    <ellipse cx="60" cy="40" rx="20" ry="23"/>
  </g>
  <!-- colletto della giacca: due tagli netti sul fondo -->
  <path d="M46 70 60 88 74 70" fill="none" stroke="#0b0f15" stroke-width="4" opacity=".85"/>
</svg>

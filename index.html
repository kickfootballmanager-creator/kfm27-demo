<!-- ===================== KFM27 · INTRO PREMIUM (AAA) ===================== -->
<link rel="stylesheet" href="src/styles/08-kfm-intro-css.css">

<div id="kfm-intro">
  <!-- SPLASH -->
  <div class="kfm-hero">
    <div class="kfm-heroimg"></div>
    <div class="kfm-heroplay">
      <div class="kfm-btnwrap">
        <button class="kfm-btn" id="kfm-playbtn"><span>Gioca ora</span></button>
        <div class="kfm-corner kfm-c1"></div><div class="kfm-corner kfm-c2"></div>
        <div class="kfm-corner kfm-c3"></div><div class="kfm-corner kfm-c4"></div>
      </div>
      <div class="kfm-hint">Premi invio per iniziare</div>
    </div>
  </div>

  <!-- MODALITA' -->
  <div class="kfm-modes">
    <div class="kfm-mbg" id="kfm-mbg"></div>
    <div class="kfm-mscrim"></div>
    <div class="kfm-mscrim2"></div>
    <div class="kfm-grain"></div>
    <div class="kfm-logo"><img src="src/img/logo.png" alt="KFM27"></div>
    <div class="kfm-mwrap">
      <div class="kfm-menu">
        <div class="kfm-mlab">Seleziona</div>
        <div id="kfm-menu"></div>
      </div>
      <div class="kfm-center">
        <div class="kfm-kick">Modalit&agrave; di gioco</div>
        <div class="kfm-cw">KFM27</div>
        <div class="kfm-cmode" id="kfm-cmode"></div>
        <div class="kfm-rule"></div>
        <div class="kfm-prev" id="kfm-prev"><div class="kfm-pvlab" id="kfm-pvlab"></div></div>
        <div class="kfm-cdesc" id="kfm-cdesc"></div>
        <div class="kfm-tags" id="kfm-ctags"></div>
        <div class="kfm-btnwrap">
          <button class="kfm-btn" id="kfm-enter"><span id="kfm-enterlbl">Entra</span></button>
          <div class="kfm-corner kfm-c1"></div><div class="kfm-corner kfm-c2"></div>
          <div class="kfm-corner kfm-c3"></div><div class="kfm-corner kfm-c4"></div>
        </div>
      </div>
      <div></div>
    </div>
    <div class="kfm-bottom">
      <span class="kfm-key"><b>&uarr; &darr;</b> Naviga</span>
      <span class="kfm-key"><b>Enter</b> Conferma</span>
      <span class="kfm-key"><b>Esc</b> Indietro</span>
    </div>
  </div>

  <!-- SCHERMO INTERO -->
  <div class="kfm-fs" id="kfm-fs">
    <div class="kfm-fsbox">
      <div class="kfm-corner kfm-c1"></div><div class="kfm-corner kfm-c2"></div>
      <div class="kfm-corner kfm-c3"></div><div class="kfm-corner kfm-c4"></div>
      <div class="kfm-fstit">Schermo intero</div>
      <div class="kfm-fstx">KFM27 &egrave; pensato per essere giocato a schermo intero. Vuoi attivarlo adesso? Per uscire baster&agrave; tenere premuto <b>ESC</b> per due secondi.</div>
      <div class="kfm-fsrow">
        <button class="kfm-btn sm" id="kfm-fsyes"><span>Gioca a schermo intero</span></button>
        <button class="kfm-btn sm ghost" id="kfm-fsno"><span>Continua in finestra</span></button>
      </div>
    </div>
  </div>
</div>

<div id="kfm-esc"><span class="ring" id="kfm-escring"></span><span id="kfm-esctx">Tieni premuto ESC per uscire</span></div>
